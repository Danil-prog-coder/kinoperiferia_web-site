services:
  # ---------- Сайт + бэкап данных в S3 ----------
  # Бэкап встроен в сам процесс сайта, поэтому порядок гарантирован:
  # Старт:     восстанавливает заявки и вложения из BACKUP_S3_KEY и только
  #            потом начинает принимать запросы — сайт не видит старых данных.
  # Работа:    каждые 30 минут перезаписывает этот объект свежим архивом
  #            (если данные не менялись — не перезаливает).
  # Остановка: (stop/restart/down, перезагрузка сервера) сначала дожидается
  #            текущих запросов, затем снимает финальный бэкап и выходит.
  web:
    build: .
    restart: unless-stopped
    # время на финальный бэкап, прежде чем Docker убьёт процесс
    stop_grace_period: 2m
    ports:
      - "8080:8080"
    environment:
      BASE_URL: ${BASE_URL:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-https://s3.storage.selcloud.ru}
      S3_REGION: ${S3_REGION:-ru-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_KEY: ${BACKUP_S3_KEY:-backups/kinoperiferia-data.tar.gz}
      BACKUP_INTERVAL_MINUTES: ${BACKUP_INTERVAL_MINUTES:-30}
      BACKUP_RESTORE_ON_START: ${BACKUP_RESTORE_ON_START:-always}
    volumes:
      - data:/data

volumes:
  data:
